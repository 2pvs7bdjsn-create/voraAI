<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIvora</title>
<meta name="description" content="AIvora, un asistente de chat por texto.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root {
  --bg: #f1f4f3; --surface: #ffffff; --fg: #13201e; --muted: #5d6f6c; --line: #d9e1df;
  --accent: #0e7a6b; --accent-fg: #ffffff; --user-bg: #13201e; --user-fg: #f1f4f3; --danger: #b3261e; --sel: #e1ece9;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1413; --surface: #151f1d; --fg: #e6efed; --muted: #8fa5a1; --line: #263634;
    --accent: #3fc7b2; --accent-fg: #06201b; --user-bg: #e6efed; --user-fg: #0d1413; --danger: #f2897f; --sel: #1d2c29;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.55; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
}
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { height: 100%; max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; }
aside { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 14px 16px 14px 0; border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.mark { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; flex: none; }
h1 { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.01em; margin: 0; line-height: 1.1; }
.sub { font-size: 0.78rem; color: var(--muted); margin: 0; }
.new { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 600; width: 100%; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 8px; }
#list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.empty { color: var(--muted); font-size: 0.88rem; margin: 0; }
.item { display: flex; align-items: center; gap: 4px; border-radius: 10px; border: 1px solid transparent; }
.item.on { background: var(--sel); border-color: var(--line); }
.item:hover { border-color: var(--line); }
.open-chat { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 10px; }
.t { display: block; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d { display: block; font-size: 0.74rem; color: var(--muted); }
.del { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; }
.del:hover { color: var(--danger); }
.confirm { display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex: 1; min-width: 0; flex-wrap: wrap; font-size: 0.85rem; }
.confirm span { flex: 1 1 100%; color: var(--danger); }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 0.82rem; }
.mini.yes { background: var(--danger); color: #fff; border-color: var(--danger); }
.storage { font-size: 0.74rem; color: var(--muted); margin: 10px 0 0; }
main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.top { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.top h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; }
.menu { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; }
#log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-fg); border-bottom-right-radius: 4px; }
.msg.err { color: var(--danger); border-color: var(--danger); }
.typing { color: var(--muted); font-size: 0.9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
.chip { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; }
.chip:hover { background: var(--accent); color: var(--accent-fg); }
form { display: flex; gap: 8px; align-items: flex-end; padding: 12px 0; border-top: 1px solid var(--line); }
textarea { flex: 1; min-width: 0; resize: none; max-height: 160px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font: inherit; line-height: 1.4; }
.send { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; padding: 11px 18px; font-weight: 600; }
.send:disabled { opacity: 0.5; cursor: default; }
.note { font-size: 0.75rem; color: var(--muted); text-align: center; margin: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.note.bad { color: var(--danger); }
.backdrop { display: none; }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .top { display: flex; }
  aside {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); z-index: 20;
    background: var(--surface); border-right: 1px solid var(--line);
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    transform: translateX(-102%); visibility: hidden;
  }
  .shell.open aside { transform: none; visibility: visible; }
  .shell.open .backdrop { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.45); border: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .typing { animation: pulse 1.2s ease-in-out infinite; }
  aside { transition: transform 0.2s ease, visibility 0.2s; }
}
@keyframes pulse { 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside id="side" aria-label="Conversaciones">
    <div class="brand">
      <div class="mark" aria-hidden="true">A</div>
      <div>
        <h1>AIvora</h1>
        <p class="sub">Asistente de chat por texto</p>
      </div>
    </div>
    <button class="new" id="new" type="button">+ Nueva conversación</button>
    <p class="label">Tus conversaciones</p>
    <div id="list"></div>
    <p class="storage">Tus conversaciones se guardan en este navegador. Si borras los datos del sitio, se pierden.</p>
  </aside>
  <button class="backdrop" id="backdrop" type="button" aria-label="Cerrar lista"></button>

  <main>
    <div class="top">
      <button class="menu" id="menu" type="button">Conversaciones</button>
      <h2>AIvora</h2>
    </div>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" aria-label="Mensaje"></textarea>
      <button class="send" id="send" type="submit">Enviar</button>
    </form>
    <p class="note" id="note">AIvora responde solo con texto y puede cometer errores.</p>
  </main>
</div>

<script>
(function () {
  var DEFAULT_NOTE = "AIvora responde solo con texto y puede cometer errores.";
  var STORE_KEY = "aivora_chats_v1";
  var $ = function (id) { return document.getElementById(id); };
  var shell = $("shell"), log = $("log"), list = $("list"), form = $("form"), input = $("input"), send = $("send"), note = $("note");

  var data = {};          // id -> chat, guardado en localStorage
  var current = null;     // {id, title, createdAt, messages}
  var busy = false;
  var confirmId = null;

  try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { data = {}; }
  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; } }
  function chats() {
    return Object.keys(data).map(function (k) { return data[k]; }).sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  }
  function newId() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function blank() { return { id: newId(), title: "", createdAt: Date.now(), messages: [] }; }
  function say(text, bad) { note.textContent = text || DEFAULT_NOTE; note.className = "note" + (bad ? " bad" : ""); }

  function el(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    if (text) d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function fmt(ts) {
    try { return new Date(ts).toLocaleDateString("es", { day: "numeric", month: "short" }); } catch (e) { return ""; }
  }
  function renderList() {
    list.textContent = "";
    var all = chats();
    if (!all.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Aún no hay conversaciones guardadas. Escribe un mensaje para empezar la primera.";
      list.appendChild(p);
      return;
    }
    all.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "item" + (current && current.id === c.id ? " on" : "");
      if (confirmId === c.id) {
        var box = document.createElement("div");
        box.className = "confirm";
        var q = document.createElement("span");
        q.textContent = "¿Eliminar esta conversación?";
        var yes = document.createElement("button");
        yes.type = "button"; yes.className = "mini yes"; yes.textContent = "Eliminar";
        yes.addEventListener("click", function () { removeChat(c.id); });
        var no = document.createElement("button");
        no.type = "button"; no.className = "mini"; no.textContent = "Cancelar";
        no.addEventListener("click", function () { confirmId = null; renderList(); });
        box.appendChild(q); box.appendChild(yes); box.appendChild(no);
        row.appendChild(box);
      } else {
        var open = document.createElement("button");
        open.type = "button"; open.className = "open-chat";
        var t = document.createElement("span"); t.className = "t"; t.textContent = c.title || "Conversación";
        var d = document.createElement("span"); d.className = "d"; d.textContent = fmt(c.updatedAt);
        open.appendChild(t); open.appendChild(d);
        open.addEventListener("click", function () { openChat(c.id); });
        var del = document.createElement("button");
        del.type = "button"; del.className = "del"; del.textContent = "Eliminar";
        del.setAttribute("aria-label", "Eliminar conversación " + (c.title || ""));
        del.addEventListener("click", function () { confirmId = c.id; renderList(); });
        row.appendChild(open); row.appendChild(del);
      }
      list.appendChild(row);
    });
  }
  function renderChat() {
    log.textContent = "";
    if (!current.messages.length) {
      el("msg bot", "¡Hola! Soy AIvora. Escríbeme tu pregunta y te respondo con texto. Guardo cada conversación para que puedas volver a ella cuando quieras.");
      var c = el("chips");
      ["Explícame qué puedes hacer", "Dame una idea para un negocio", "Ayúdame a redactar un correo"].forEach(function (t) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = t;
        b.addEventListener("click", function () { ask(t); });
        c.appendChild(b);
      });
    } else {
      current.messages.forEach(function (m) { el("msg " + (m.role === "user" ? "user" : "bot"), m.content); });
    }
    log.scrollTop = log.scrollHeight;
  }
  function closeDrawer() { shell.classList.remove("open"); }
  function startNew() {
    if (busy) return;
    current = blank(); confirmId = null;
    renderChat(); renderList(); closeDrawer(); input.focus();
  }
  function openChat(id) {
    if (busy || !data[id]) return;
    var c = data[id];
    current = { id: c.id, title: c.title, createdAt: c.createdAt, messages: c.messages.slice() };
    confirmId = null;
    renderChat(); renderList(); closeDrawer();
  }
  function removeChat(id) {
    confirmId = null;
    delete data[id];
    persist();
    if (current && current.id === id) { current = blank(); renderChat(); }
    renderList();
  }
  function saveCurrent() {
    data[current.id] = { id: current.id, title: current.title, createdAt: current.createdAt, updatedAt: Date.now(), messages: current.messages.slice() };
    if (!persist()) say("No se pudo guardar la conversación en este navegador.", true); else say();
    renderList();
  }
  function resize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (text.length > 4000) { say("El mensaje es muy largo. Acórtalo a menos de 4000 caracteres.", true); return; }
    if (log.querySelector(".chips")) log.textContent = "";
    busy = true; send.disabled = true; say();
    current.messages.push({ role: "user", content: text });
    if (!current.title) current.title = text.length > 44 ? text.slice(0, 44) + "…" : text;
    var userEl = el("msg user", text);
    input.value = ""; resize();
    var out = el("msg bot typing", "Escribiendo…");

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: current.messages.slice(-40) })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (r) {
      if (!r.ok || !r.j.text) throw new Error(r.j.error || "error");
      out.className = "msg bot";
      out.textContent = r.j.text;
      current.messages.push({ role: "assistant", content: r.j.text });
      saveCurrent();
    }).catch(function (e) {
      current.messages.pop();
      if (!current.messages.length) current.title = "";
      userEl.remove();
      input.value = text; resize();
      out.className = "msg bot err";
      out.textContent = "No pude responder. Tu mensaje sigue en la caja, inténtalo de nuevo.";
    }).then(function () {
      busy = false; send.disabled = false; input.focus();
    });
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); ask(input.value); });
  input.addEventListener("input", resize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  $("new").addEventListener("click", startNew);
  $("menu").addEventListener("click", function () { shell.classList.add("open"); });
  $("backdrop").addEventListener("click", closeDrawer);

  var all = chats();
  current = all.length ? { id: all[0].id, title: all[0].title, createdAt: all[0].createdAt, messages: all[0].messages.slice() } : blank();
  renderChat(); renderList();
})();
</script>
</body>
</html>
